name: greenlight
version: 0.1.0
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21.5"
description: Review and approve every xStocks trade before anything is sent. See the price and risk, approve in one click, and keep a tamper-proof history. Your wallet confirms the trade, so Greenlight never holds your keys.
author: Datwebguy
license: MIT
homepage: https://github.com/Datwebguy/greenlight
tags: [solana, xstocks, trading, approval, safety]
provides_tools:
  - propose_trade
  - get_trade_status
  - list_receipts
provides_hooks:
  - pre_tool_call
  - pre_llm_call
config_schema:
  default_wallet: {type: str, default: "", label: "Your wallet address", description: "Your public Solana wallet address. Never enter a private key or seed phrase here."}
  daily_cap_usd: {type: float, default: 0, label: "Daily limit (USD)", description: "Optional. Greenlight will not set up trades beyond this total per day. Leave at 0 for no limit."}
  max_trade_usd: {type: float, default: 0, label: "Per-trade limit (USD)", description: "Optional. Greenlight will not set up a single trade above this amount. Leave at 0 for no limit."}
  allowed_assets: {type: str, default: "", label: "Only allow these stocks", description: "Optional. A list like NVDAx, AAPLx. Leave empty to allow any xStock."}
  max_quote_drift_pct: {type: float, default: 1.0, label: "Price-change tolerance (%)", description: "If the price gets worse than this between your review and your approval, Greenlight asks for a fresh quote."}
  proposal_ttl_minutes: {type: int, default: 10, label: "Time to decide (minutes)", description: "How long a trade waits for your decision before it expires."}
  release_window_minutes: {type: float, default: 30, label: "Time to confirm after approving (minutes)", description: "After you approve, the wallet link stays available for this long."}
